# XcodeGen fallback.
# If the checked-in Scaffold.xcodeproj ever misbehaves on your Xcode version,
# delete it and regenerate a fresh one:
#
#   brew install xcodegen
#   cd ios && xcodegen generate
#
name: Scaffold
options:
  bundleIdPrefix: com.scaffold
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Scaffold:
    type: application
    platform: iOS
    sources:
      - path: Scaffold
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scaffold.adhd
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Scaffold
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: YES
