<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI News</title>
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AI News">
    <link rel="apple-touch-icon" href="icons/icon-192.svg">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Top Header -->
    <header class="top-header">
        <div class="header-logo">AI News</div>
        <div class="header-actions">
            <button id="install-btn" class="header-icon-btn" style="display:none;" title="Install App">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </button>
            <button id="refresh-btn" class="header-icon-btn" title="Refresh">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            </button>
        </div>
    </header>

    <!-- Stories Bar -->
    <div class="stories-bar" id="stories-bar">
        <div class="story-item active" data-source="">
            <div class="story-ring all">
                <div class="story-avatar all-avatar">ALL</div>
            </div>
            <span class="story-name">All</span>
        </div>
    </div>

    <!-- Main Feed -->
    <main class="feed" id="feed">

        <!-- Loading State -->
        <div id="loading" class="loading-state">
            <div class="skeleton-card">
                <div class="skeleton-header"><div class="skeleton-circle"></div><div class="skeleton-lines"><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div></div></div>
                <div class="skeleton-img"></div>
                <div class="skeleton-body"><div class="skeleton-line w90"></div><div class="skeleton-line w70"></div></div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton-header"><div class="skeleton-circle"></div><div class="skeleton-lines"><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div></div></div>
                <div class="skeleton-img"></div>
                <div class="skeleton-body"><div class="skeleton-line w90"></div><div class="skeleton-line w70"></div></div>
            </div>
        </div>

        <!-- Error State -->
        <div id="error" class="state-message" style="display:none;">
            <div class="state-icon">&#128225;</div>
            <h2>Couldn't load news</h2>
            <p>Check your connection and try again.</p>
            <button id="retry-btn" class="action-button">Try Again</button>
        </div>

        <!-- Empty State -->
        <div id="empty" class="state-message" style="display:none;">
            <div class="state-icon">&#128270;</div>
            <h2>No articles found</h2>
            <p>Try a different source filter.</p>
            <button id="empty-refresh-btn" class="action-button">Refresh</button>
        </div>

        <!-- Feed Cards Container -->
        <div id="feed-cards"></div>

    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-tab="home">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L3 9v12a1 1 0 001 1h5a1 1 0 001-1v-5h4v5a1 1 0 001 1h5a1 1 0 001-1V9l-9-7z"/></svg>
            <span>Home</span>
        </button>
        <button class="nav-item" data-tab="explore">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <span>Explore</span>
        </button>
        <button class="nav-item" data-tab="saved">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
            <span>Saved</span>
        </button>
        <button class="nav-item" data-tab="profile">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>Profile</span>
        </button>
    </nav>

    <script src="articles.js"></script>
    <script src="app.js"></script>
</body>
</html>
